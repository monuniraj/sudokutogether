  <!-- INVITE PARAM RESCUE: Captures challenge URL params synchronously before React/SW
         swallows them. Runs before any framework code, persists into sessionStorage.
         This is the canonical PWA deep-link fix pattern. -->
  <script>
    (function () {
      try {
        var p = new URLSearchParams(window.location.search);
        var c = p.get('challenge') || p.get('gameId') || p.get('c') || p.get('room') || p.get('roomId');
        var d = p.get('daily');
        if (c) {
          sessionStorage.setItem('sudoku_invite_challenge', c);
          sessionStorage.setItem('sudoku_invite_pw', p.get('pw') || p.get('password') || '');
          sessionStorage.setItem('sudoku_invite_sender', p.get('sender') || p.get('senderName') || p.get('invitedBy') || '');
          sessionStorage.setItem('sudoku_invite_view', p.get('view') || '');
        }
        if (d) {
          sessionStorage.setItem('sudoku_invite_daily', d);
        }
        // Also rescue hash-embedded params (e.g. /#?challenge=..., /#?daily=...)
        if ((!c || !d) && window.location.hash) {
          var hi = window.location.hash.indexOf('?');
          if (hi !== -1) {
            var hp = new URLSearchParams(window.location.hash.substring(hi + 1));
            if (!c) {
              var hc = hp.get('challenge') || hp.get('gameId') || hp.get('c') || hp.get('room') || hp.get('roomId');
              if (hc) {
                sessionStorage.setItem('sudoku_invite_challenge', hc);
                sessionStorage.setItem('sudoku_invite_pw', hp.get('pw') || hp.get('password') || '');
                sessionStorage.setItem('sudoku_invite_sender', hp.get('sender') || hp.get('senderName') || '');
                sessionStorage.setItem('sudoku_invite_view', hp.get('view') || '');
              }
            }
            if (!d) {
              var hd = hp.get('daily');
              if (hd) {
                sessionStorage.setItem('sudoku_invite_daily', hd);
              }
            }
          } else if (!c) {
            var cleanHash = window.location.hash.replace(/^[#\/]+/, '');
            if (cleanHash.startsWith('SUDOKU-')) {
              sessionStorage.setItem('sudoku_invite_challenge', cleanHash);
            }
          }
        }
      } catch (e) { }
    })();
  </script>

  <script>
    (function () {
      try {
        var d = localStorage.getItem('sudoku_darkMode');
        if (d === 'true' || (d === null && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) { }
    })();
  </script>
